name: Create Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version to deploy (e.g. 1.2.3, no "v"). Leave blank for the current gradle.properties version.'
        required: false
        type: string

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read
  release:
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check_release.outcome == 'failure' }}
      version: ${{ steps.version.outputs.version }}
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      POSTGRES_DB_PASSWORD: ${{ secrets.POSTGRES_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assemble

      - name: Extract version from gradle.properties
        id: version
        run: |
          VERSION=$(grep 'project_version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if release exists
        id: check_release
        continue-on-error: true
        run: |
          gh release view v${{ steps.version.outputs.version }} > /dev/null 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.check_release.outcome == 'failure'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          artifacts: 'build/libs/*-all.jar'
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
  docker:
    needs: release
    # Publish the image only for a newly created release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      version: ${{ needs.release.outputs.version }}
      publish: true
  deploy:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release JAR
        run: gh release download "v$VERSION" --repo "$REPO" --pattern '*-all.jar' --dir dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || needs.release.outputs.version }}
          REPO: ${{ github.repository }}
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          # Waits until your VM is reachable before continuing
          ping: modcordgay.tailfb2424.ts.net
      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v1
        with:
          host: modcordgay.tailfb2424.ts.net
          username: modcorduser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*-all.jar"
          target: "/home/modcorduser/Modcord/"
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: modcordgay.tailfb2424.ts.net
          username: modcorduser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/modcorduser/Modcord
            sudo rc-service modcord stop
            mv *-all.jar Modcord.jar
            sudo rc-service modcord start
            sleep 3
            sudo rc-service modcord status > /dev/null 2>&1 && echo "✅ Modcord is running" || { echo "❌ Modcord failed to start"; exit 1; }
