name: Docker Image

permissions:
  contents: read

on:
  # Build-only check (no push) whenever the Docker setup changes
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - build.gradle.kts
      - gradle/**
      - src/**
      - .github/workflows/docker.yml
  # Called by release.yml to publish the image to GHCR after a new release is created
  workflow_call:
    inputs:
      version:
        description: 'Release version (no "v") used to tag the image'
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when publishing (workflow_call); PR builds never push
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the repository name, which GHCR requires
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
