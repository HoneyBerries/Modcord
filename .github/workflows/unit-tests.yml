name: Unit Tests

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml and release.yml so neither ships a build with failing unit tests
  workflow_call:

jobs:
  unitTests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test
