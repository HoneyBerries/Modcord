name: VPS Health
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Optional command to run on the VPS. Leave empty for the standard health check."
        required: false
        default: ""
permissions:
  contents: read
concurrency: vps-health
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          # Waits until your VM is reachable before continuing
          ping: modcordgay.tailfb2424.ts.net
      - name: Run on VPS
        uses: appleboy/ssh-action@v1
        env:
          COMMAND: ${{ inputs.command }}
        with:
          host: modcordgay.tailfb2424.ts.net
          username: modcorduser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: COMMAND
          command_timeout: 10m
          script: |
            if [ -n "$COMMAND" ]; then
              bash -c "$COMMAND"
              exit $?
            fi
            echo "== service =="
            sudo -n rc-service modcord status || echo "NOT ACTIVE"
            sudo -n rc-status --crashed || true
            echo "== uptime / load =="
            uptime
            echo "== memory =="
            free -m
            echo "== disk =="
            df -h /
            echo "== recent service stderr =="
            tail -30 /var/log/modcord.err 2>&1 || true
            echo "== out-of-memory kills =="
            (sudo -n dmesg || dmesg) 2>&1 | grep -i -E "out of memory|killed process" | tail -5 || true
            echo "== bot log errors (latest.log) =="
            grep -i -E "error|exception|outofmemory|timeout|disconnect" /home/modcorduser/Modcord/logs/latest.log 2>/dev/null | tail -30 || true
            echo "== last 20 bot log lines (latest.log) =="
            tail -20 /home/modcorduser/Modcord/logs/latest.log 2>&1 || true
