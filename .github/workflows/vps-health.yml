name: VPS Health
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Optional command to run on the VPS. Leave empty for the standard health check."
        required: false
        default: ""
permissions:
  contents: read
concurrency: vps-health
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          # Waits until your VM is reachable before continuing
          ping: modcordvm.tailfb2424.ts.net
      - name: Run on VPS
        uses: appleboy/ssh-action@v1
        env:
          COMMAND: ${{ inputs.command }}
        with:
          host: modcordvm.tailfb2424.ts.net
          username: ModcordUser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: COMMAND
          command_timeout: 10m
          script: |
            if [ -n "$COMMAND" ]; then
              bash -c "$COMMAND"
              exit $?
            fi
            echo "== service =="
            systemctl is-active modcord || echo "NOT ACTIVE"
            systemctl show modcord -p NRestarts -p ActiveEnterTimestamp -p MainPID
            echo "== uptime / load =="
            uptime
            echo "== memory =="
            free -m
            echo "== disk =="
            df -h /
            echo "== failed services =="
            systemctl --failed --no-legend || true
            echo "== recent bot errors =="
            (sudo -n journalctl -u modcord -n 300 --no-pager || journalctl -u modcord -n 300 --no-pager) 2>&1 | grep -i -E "error|exception|outofmemory|timeout|disconnect" | tail -30 || true
            echo "== out-of-memory kills =="
            (sudo -n dmesg -T || dmesg -T) 2>&1 | grep -i -E "out of memory|killed process" | tail -5 || true
            echo "== bot log errors (latest.log) =="
            grep -i -E "error|exception|outofmemory|timeout|disconnect" /home/ModcordUser/Modcord/logs/latest.log 2>/dev/null | tail -30 || true
            echo "== last 20 bot log lines (latest.log) =="
            tail -20 /home/ModcordUser/Modcord/logs/latest.log 2>&1 || true
            echo "== last 20 service log lines =="
            (sudo -n journalctl -u modcord -n 20 --no-pager || journalctl -u modcord -n 20 --no-pager) 2>&1
